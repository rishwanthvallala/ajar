name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the agent
        run: cargo build --release --target ${{ matrix.target }} -p ajar
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/ajar-${{ matrix.target }}.tar.gz" \
              -C "target/${{ matrix.target }}/release" ajar
          shasum -a 256 "dist/ajar-${{ matrix.target }}.tar.gz" \
            | cut -d' ' -f1 > "dist/ajar-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # install.sh fetches ajar-<target>.tar.gz from the release, so the
      # asset names here are load-bearing.
      - run: mkdir -p dist && find artifacts -type f -exec mv {} dist/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
