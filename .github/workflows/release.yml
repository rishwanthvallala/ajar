name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Static. Built against the runner's glibc, the binary needed a
          # glibc as new as the runner's — 2.39 — and ran on none of Ubuntu
          # 22.04, Debian 12 or RHEL 9.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: The C compiler ring needs, for musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build the agent
        run: cargo build --release --target ${{ matrix.target }} -p ajar
      - name: A Linux binary depends on nothing
        if: contains(matrix.target, 'musl')
        run: |
          file "target/${{ matrix.target }}/release/ajar" | tee /dev/stderr | grep -q 'statically linked'
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/ajar-${{ matrix.target }}.tar.gz" \
              -C "target/${{ matrix.target }}/release" ajar
          shasum -a 256 "dist/ajar-${{ matrix.target }}.tar.gz" \
            | cut -d' ' -f1 > "dist/ajar-${{ matrix.target }}.tar.gz.sha256"
          # Under the old name too. An install.sh from before 8 October asks
          # for the -gnu build, and the static one runs wherever that did.
          case "${{ matrix.target }}" in
            *-linux-musl)
              old="dist/ajar-$(echo "${{ matrix.target }}" | sed 's/-musl$/-gnu/').tar.gz"
              cp "dist/ajar-${{ matrix.target }}.tar.gz" "$old"
              shasum -a 256 "$old" | cut -d' ' -f1 > "$old.sha256"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # install.sh fetches ajar-<target>.tar.gz from the release, so the
      # asset names here are load-bearing.
      - run: mkdir -p dist && find artifacts -type f -exec mv {} dist/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
