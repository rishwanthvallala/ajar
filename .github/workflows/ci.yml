name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      # fmt, clippy -D warnings, cargo test, tsc, and every smoke suite.
      - run: ./scripts/check.sh

      # Landlock is a kernel feature, so this is the one check that genuinely
      # needs a Linux runner rather than a borrowed kernel.
      - name: Attack the Linux sandbox
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/linux-sandbox.sh
