name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      # The UI suite drives a real browser. Without this it would skip, and
      # a check that skips in the one place it has to run is not a check.
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # fmt, clippy -D warnings, cargo test, tsc, the UI suite, every smoke suite.
      #
      # On failure the end of the output also becomes an annotation. A job's
      # log can only be read signed in, and its annotations can be read by
      # anyone through the API — which is the difference between a macOS-only
      # failure being diagnosable from a terminal or not.
      - name: Run ./scripts/check.sh
        run: |
          set -o pipefail
          ./scripts/check.sh 2>&1 | tee check.log || {
            status=$?
            tail -n 60 check.log | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { gsub(/\r/, "%0D"); print }' > tail.txt
            echo "::error title=check.sh failed on ${{ matrix.os }}::$(cat tail.txt)"
            exit $status
          }

      # Landlock is a kernel feature, so this is the one check that genuinely
      # needs a Linux runner rather than a borrowed kernel.
      - name: Attack the Linux sandbox
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/linux-sandbox.sh

      # The rate limits live in the Caddyfile, which nothing else here reads.
      # Built for the server too, so a plugin that stops compiling for arm64
      # fails here rather than halfway through a deploy.
      - uses: actions/setup-go@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          go-version-file: deploy/caddy/go.mod
          cache-dependency-path: deploy/caddy/go.sum
      - name: Caddy's rate limits
        if: matrix.os == 'ubuntu-latest'
        run: |
          deploy/caddy/build.sh
          GOARCH=amd64 deploy/caddy/build.sh
          deploy/caddy/check.sh
