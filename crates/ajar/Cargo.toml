[package]
name = "ajar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# No version: a path dependency inside a workspace that is never published
# to crates.io does not need one, and pinning it here means every release
# bump is three edits with a build failure if you miss one.
ajar-proto = { path = "../ajar-proto" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
ignore = "0.4.33"
notify = "8.2.0"
portable-pty = "0.9.0"
rand = "0.10.2"
ratatui = "0.30.2"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "io-util", "net", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yrs = "0.27.4"
[[bin]]
name = "ajar"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
