<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pad</title>
      <!--
      The SDK's WISP transport imports its client by bare specifier, which
      assumes a bundler; we vendor the SDK unbundled because bundling it breaks
      its workers. The import runs in this document, so a map here resolves it.
      Inert unless a sandbox is started with a wisp network policy.
    -->
    <script type="importmap">
      {
        "imports": {
          "@mercuryworkshop/wisp-js/client": "/vendor/wisp/src/entrypoints/client.mjs"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <span id="title" class="name"></span>
      <span id="status" class="status"></span>
      <span id="presence" class="presence"></span>
      <span class="grow"></span>
      <button id="run" class="primary" title="Run this file (⌘⏎)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5l7 4.5-7 4.5V3.5Z" fill="currentColor"/></svg>
        Run
      </button>
      <button id="preview" title="Open the server running in this folder" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h9A1.5 1.5 0 0 1 14 4.5v7A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5v-7Z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2 6h12" stroke="currentColor" stroke-width="1.2"/></svg>
        Preview
      </button>
      <button id="share" title="Copy the link">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5a2.5 2.5 0 0 0 3.6.1l2.2-2.2a2.5 2.5 0 0 0-3.5-3.5l-1 1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M9.5 6.5a2.5 2.5 0 0 0-3.6-.1L3.7 8.6a2.5 2.5 0 0 0 3.5 3.5l1-1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Share
      </button>
    </header>
    <main>
      <nav id="files" class="files"></nav>
      <div class="panes">
        <div id="editor" class="editor"></div>
        <div id="preview-pane" class="preview" hidden></div>
        <div id="terminal" class="terminal"></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
