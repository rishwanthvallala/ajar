# The box's front: TLS, the pad's files, the rate limits, and the relay and
# the sandbox's way out behind it. Installed as /etc/nginx/nginx.conf, with
# the sites (sites.conf) and their headers and proxy settings beside it in
# /etc/nginx/ajar/, by deploy/deploy.sh when deploy/front says nginx.
#
# It was Caddy (deploy/Caddyfile) until 14 November 2026. Measured on a
# t4g.small like production's, through each with TLS and its access log:
# Caddy answered 3,100 small-pad reads a second and nginx 8,100, at a quarter
# of Caddy's 99th percentile — Caddy was four-fifths of the box's CPU
# (docs/dev/scaling.md, "On the box's own hardware"). What Caddy did here,
# this does, rule for rule; where the two differ it says so.

user www-data;
worker_processes auto;
worker_rlimit_nofile 65536;
# How long a reload or a stop waits for open connections — terminals, pad
# rooms, the sandbox's way out, held for hours — before closing them. Caddy's
# `grace_period 10s`, for the same reason: a reload waiting for ever never
# finishes. Whoever is cut off reconnects, as after every relay restart.
worker_shutdown_timeout 10s;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
# The packaged modules: headers-more (the Server header) and brotli.
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    # What Ubuntu's nginx 1.24 does not know and Caddy did. `.mjs` above all:
    # the Wasmer SDK imports modules by that name, and a module script sent as
    # application/octet-stream is refused by the browser — the SDK did not
    # load, and no command ran ("Failed to fetch dynamically imported
    # module"), found by the fresh-browser check through this config before
    # it served anyone. These add to the list above rather than replace it.
    types {
        text/javascript mjs;
        font/ttf ttf;
        application/json map;
    }
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 10000;
    # Caddy sent no Server header; this sends none either.
    server_tokens off;
    more_clear_headers Server;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ajar_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Who a request is from: `$remote_addr`, which every rate limit below is
    # keyed on and every upstream is told in X-Forwarded-For — the relay's
    # quotas and wisp's per-address cap count by it.
    #
    # Cloudflare's CF-Connecting-IP is believed from loopback only, which is
    # where cloudflared connects from once Cloudflare Tunnel carries the sites
    # (docs/dev/cloudflare.md): Cloudflare's edge sets that header, over
    # whatever the visitor sent. Until then nothing outside the box arrives
    # over loopback, and `$remote_addr` is the connection's own address.
    #
    # Not Cloudflare's published ranges: WARP, Cloudflare's free VPN, leaves
    # from those same ranges, so any WARP user could connect here directly and
    # claim to be any address at all — a new budget on every request.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # An address as the rate limits count it: an IPv6 one by its /64, which is
    # what one household or one host is given — counted by the whole address,
    # one machine could make itself 2^64 visitors. An IPv4 one whole.
    map $remote_addr $addr_key {
        "~^(?<p>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):" $p;
        "~^(?<p>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::" "$p:0";
        "~^(?<p>[0-9a-f]+:[0-9a-f]+)::" "$p:0:0";
        "~^(?<p>[0-9a-f]+)::" "$p:0:0:0";
        default $remote_addr;
    }

    # A WebSocket's upgrade passed on; anything else keeps its connection to
    # the upstream open for the next request.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    # Link-preview fetchers, which get a page of Open Graph tags from the
    # relay (`unfurl` in main.rs) in place of the pad, which they cannot run.
    map $http_user_agent $unfurl_bot {
        default 0;
        "~*(slackbot|discordbot|twitterbot|facebookexternalhit|facebot|whatsapp|telegrambot|linkedinbot|skypeuripreview|mattermost|redditbot|embedly|iframely|pinterest|applebot|bluesky|mastodon|vkshare|zulip|snapchat|line-poker|google-pagerenderer|microsoftpreview)" 1;
    }
    # Where such a fetcher is sent: the relay's page for the pad it asked
    # about, when the path can be a pad's name — nothing with a dot or a slash
    # in it — and nowhere else, so everything else it asks for is answered as
    # for anyone. Worked out here rather than by a rewrite that might not
    # match inside an `if`: there, a path it did not match was not found, the
    # page's own fallback being lost inside the `if`.
    map "$unfurl_bot:$uri" $unfurl_to {
        default "";
        "~^1:/(?<pad>[A-Za-z0-9][A-Za-z0-9-]{0,63})/?$" /api/unfurl/$pad;
    }

    # Per-address limits on what the relay never sees — the files served off
    # disk, name resolution and the way out — because nothing else can bound
    # them. Measured and argued in docs/dev/security.md.
    #
    # Caddy's were so many events in a sliding window; nginx's are a bucket
    # that refills: the same allowance at once, then a steady trickle, which
    # is if anything kinder to the person and no kinder to a loop.
    #
    # The page's files: keyed on the address *and the file*, 100 fetches of a
    # file an hour. A first visit fetches each file once and a returning one
    # nothing, so this is "first visits an hour" for every file at once. Only
    # a file that exists makes a key (`$files_key`, set where they are
    # served): any other path is a 404, and an empty key is never counted.
    # `$uri` is the cleaned path, so `//`, `/./` or `%70` in a URL cannot make
    # a fresh budget of it.
    limit_req_zone $files_key zone=pad_files:10m rate=2r/m;
    # A first visit resolves four names and `pip install` a few more.
    limit_req_zone $addr_key zone=pad_dns:10m rate=2r/s;
    # One connection per visit. This bounds how fast they arrive; how many
    # stay open is wisp-server.mjs's, eight per address.
    limit_req_zone $addr_key zone=pad_wisp:10m rate=30r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    # Each request: when, from where, which site and path, what it got, how
    # big and how long, and the browser's description of itself. Never the
    # query string — an OAuth callback's one-time code is in it — and none of
    # the headers that are as good as a sign-in or a link: Cookie,
    # Authorization, X-Pad-Code (audit B05). `seq` is whether a pad read said
    # what the page has, for scripts/traffic-mix.py.
    log_format ajar escape=json '{"ts":$msec,"ip":"$remote_addr","host":"$host","method":"$request_method","uri":"$uri","status":$status,"size":$body_bytes_sent,"took":$request_time,"ua":"$http_user_agent","seq":"$http_x_pad_seq"}';
    access_log off;

    # What goes out compressed when it was not stored that way: the API's
    # JSON, the pages. The packages are stored compressed (brotli_static,
    # gzip_static, where they are served).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    upstream relay {
        server 127.0.0.1:8787;
        # Connections kept open between requests. Caddy kept 32 until it was
        # told otherwise, and past 32 requests at once every further one
        # opened a connection to the relay and closed it after.
        keepalive 256;
    }

    upstream wisp {
        server 127.0.0.1:8788;
    }

    include /etc/nginx/ajar/sites.conf;
}
