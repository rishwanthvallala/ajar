# The three sites, and port 80. Installed as /etc/nginx/ajar/sites.conf; the
# deploy writes ajar.rishwanth.dev as its DOMAIN, as it did in the Caddyfile.
#
# Certificates are in /etc/ajar/tls/<site>/: Caddy's, copied over at the
# switch, and then certbot's, which `tls-hook.sh` copies there on every
# renewal and reloads for. See docs/dev/operations.md, "The front".

# Port 80: Let's Encrypt's challenges, for certbot, and everything else to
# https. Caddy did the same by itself.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------ ajar.rishwanth.dev
#
# The relay serves the web client, the join pages, /install.sh and /ws.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ajar.rishwanth.dev;
    ssl_certificate /etc/ajar/tls/ajar.rishwanth.dev/fullchain.pem;
    ssl_certificate_key /etc/ajar/tls/ajar.rishwanth.dev/privkey.pem;
    access_log /var/log/nginx/ajar.log ajar;
    include /etc/nginx/ajar/ajar-headers.conf;

    location / {
        include /etc/nginx/ajar/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A terminal can sit untouched for a long time and must not be hung
        # up on.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_pass http://relay;
    }
}

# ------------------------------------------------------------ code.rishwanth.dev
#
# The pad. Its page and the runtime's files from /srv/ajar/pad; its API, its
# sign-in and its rooms from the relay; the sandbox's way out and its name
# lookups through here.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name code.rishwanth.dev;
    ssl_certificate /etc/ajar/tls/code.rishwanth.dev/fullchain.pem;
    ssl_certificate_key /etc/ajar/tls/code.rishwanth.dev/privkey.pem;
    access_log /var/log/nginx/code.log ajar;
    root /srv/ajar/pad;
    include /etc/nginx/ajar/code-headers.conf;
    # A refusal of the rate limits, said as one and never kept: the
    # immutable header of a refused package would have told the browser to
    # keep the refusal for a year.
    error_page 429 = @too_many;

    # The relay holds the pads and routes the rooms.
    location /api/ {
        include /etc/nginx/ajar/proxy.conf;
        proxy_set_header Connection "";
        proxy_pass http://relay;
    }
    # Signing in with Google or GitHub: out to the provider and back. Without
    # this the callback fell through to the page, which answered 200 with
    # index.html and the sign-in silently went nowhere.
    location /auth/ {
        include /etc/nginx/ajar/proxy.conf;
        proxy_set_header Connection "";
        proxy_pass http://relay;
    }
    location = /ws {
        include /etc/nginx/ajar/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_pass http://relay;
    }

    # The pad's way out to the network. A sandbox in the browser cannot open
    # a TCP socket, so it opens one WebSocket here and the endpoint behind it
    # makes the real connections — to PyPI and nowhere else; the allowlist is
    # deploy/wisp-server.mjs's. Both spellings: the SDK appends a slash to
    # whatever URL it is given, and /wisp/ falling through to the page
    # answered 200 with index.html, which the browser reported as "handshake
    # failed: unexpected response code 200". See docs/dev/networking.md.
    location ~ ^/wisp(/.*)?$ {
        limit_req zone=pad_wisp burst=29 nodelay;
        include /etc/nginx/ajar/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_pass http://wisp;
    }

    # Name resolution for the sandbox, proxied rather than pointed at a third
    # party: the SDK resolves over DNS-over-HTTPS with fetch, and its default,
    # cloudflare-dns.com, is a cross-origin request `connect-src 'self'`
    # refuses — inside the sandbox "Name does not resolve", in the console
    # "Failed to fetch". Same-origin keeps it allowed without widening the
    # policy, and the names a person resolves off a third party's logs.
    #
    # Only what DoH is: GET and POST, and a query of a few hundred bytes —
    # anything with a megabyte attached is using it as something else. Sent
    # on with nothing of the visitor's: no address, and none of the cookies
    # and codes a same-origin fetch carries (Caddy passed those on).
    location = /dns-query {
        if ($request_method !~ ^(GET|POST)$) {
            return 405 "this endpoint answers DNS queries, nothing else\n";
        }
        limit_req zone=pad_dns burst=119 nodelay;
        client_max_body_size 4k;
        proxy_http_version 1.1;
        proxy_set_header Host cloudflare-dns.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Pad-Code "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_ssl_server_name on;
        proxy_ssl_name cloudflare-dns.com;
        proxy_pass https://cloudflare-dns.com;
    }

    # The privacy policy and the terms, at the plain addresses Google's
    # consent screen and Razorpay's review link to. Static pages in the pad's
    # build; `privacy` and `terms` are reserved names, so no pad sits here.
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /terms {
        try_files /terms.html =404;
    }

    # The lists beside the packages — which file is which package, and what
    # the registry answered for each — change when a package does, and are
    # asked again each visit: an empty 304 when nothing changed. Kept for a
    # year until 12 October, a returning browser held a list naming files a
    # later deploy had removed, and fell back to Wasmer for all of it.
    location ~ ^/packages/[^/]+\.json$ {
        set $files_key "";
        if (-f $request_filename) {
            set $files_key $binary_remote_addr$uri;
        }
        limit_req zone=pad_files burst=99 nodelay;
        include /etc/nginx/ajar/code-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri @missing_asset;
    }

    # The page's scripts, the vendored SDK and the runtime's packages:
    # content-addressed or under a folder named for a hash of what is in it,
    # so nothing here is worth asking about again. Most of what makes a
    # second visit free.
    #
    # Stored compressed by the build — brotli at its highest setting beside
    # each package, and gzip — and sent as stored: compressing on the fly is
    # a setting no server would spend per request, and `.webc` has no type
    # that would get it compressed at all. 72 MB went out raw that way once.
    location ~ ^/(assets|vendor|packages)/ {
        set $files_key "";
        if (-f $request_filename) {
            set $files_key $binary_remote_addr$uri;
        }
        limit_req zone=pad_files burst=99 nodelay;
        brotli_static on;
        gzip_static on;
        include /etc/nginx/ajar/code-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @missing_asset;
    }

    # A file under the asset folders that is not there is not found — never
    # the page, which a script would read as itself, and never kept: it may
    # well be there after the next deploy.
    location @missing_asset {
        include /etc/nginx/ajar/code-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 404 "not found\n";
    }

    location @too_many {
        include /etc/nginx/ajar/code-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        default_type text/plain;
        return 429 "Too many requests from your address. Try again in a few minutes.\n";
    }

    # Everything else is a pad's name, which the page reads off the URL —
    # or a link-preview fetcher asking about one, which gets the relay's page
    # of Open Graph tags instead, since a pad is nothing but script. Only a
    # path that can be a pad's name: nothing with a dot or a slash in it.
    location / {
        if ($unfurl_to) {
            rewrite ^ $unfurl_to last;
        }
        brotli_static on;
        gzip_static on;
        include /etc/nginx/ajar/code-headers.conf;
        # Asked again each visit, an empty 304 when nothing changed: a page
        # kept past a deploy asks for scripts the deploy removed.
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# ------------------------------------------------------------ preview.rishwanth.dev
#
# Where a server running inside somebody's pad is served from. A third
# origin, and it has to be one: the sandbox's responses are whatever a
# visitor decided to run, and from the pad's own origin they could script the
# pad, read its storage and reach its service worker. Only two files live
# here; with no pad open, it serves a 404 and nothing else.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name preview.rishwanth.dev;
    ssl_certificate /etc/ajar/tls/preview.rishwanth.dev/fullchain.pem;
    ssl_certificate_key /etc/ajar/tls/preview.rishwanth.dev/privkey.pem;
    access_log /var/log/nginx/preview.log ajar;
    include /etc/nginx/ajar/preview-headers.conf;

    # The control document: the SDK's script, which connects the pad to the
    # worker, and the pad's, which carries what the preview reports. Inline,
    # because it is one line.
    location = /.wasmer/host.html {
        include /etc/nginx/ajar/preview-headers.conf;
        add_header Cache-Control "no-cache";
        default_type "text/html; charset=utf-8";
        return 200 '<!doctype html><meta charset="utf-8"><script type="module" src="/wasmer-host.js"></script><script type="module" src="/pad-preview.js"></script>';
    }
    # The SDK's half, from the vendored SDK the pad already ships, so it is
    # never a different version from the client talking to it.
    location = /wasmer-host.js {
        include /etc/nginx/ajar/preview-headers.conf;
        add_header Cache-Control "no-cache";
        types { }
        default_type "text/javascript; charset=utf-8";
        alias /srv/ajar/pad/vendor/wasmer/service-worker-host.js;
    }
    location = /pad-preview.js {
        include /etc/nginx/ajar/preview-headers.conf;
        add_header Cache-Control "no-cache";
        types { }
        default_type "text/javascript; charset=utf-8";
        alias /srv/ajar/pad/vendor/preview/relay.js;
    }
    location = /wasmer-service-worker.js {
        include /etc/nginx/ajar/preview-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        types { }
        default_type "text/javascript; charset=utf-8";
        alias /srv/ajar/pad/vendor/preview/sw.js;
    }
    location / {
        default_type text/plain;
        return 404 "no preview is running\n";
    }
}
