# Every answer from preview.rishwanth.dev, where a server running inside
# somebody's pad is served from.
#
# The pad is cross-origin isolated, so a document embedded in it must carry
# these or the browser refuses the frame — and the SDK reports only "the
# Wasmer HTTP host did not become ready", which reads like slowness rather
# than a blocked load.
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Framed by the pad and by nothing else.
add_header Content-Security-Policy "default-src 'self'; frame-ancestors https://code.rishwanth.dev; base-uri 'none'" always;
