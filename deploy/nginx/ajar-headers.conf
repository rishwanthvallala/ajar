# Every answer from ajar.rishwanth.dev, the session client's origin.
#
# The web client is self-contained: no CDN, no third-party anything. Said, so
# a compromised dependency has nowhere to phone home to.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' wss://ajar.rishwanth.dev; frame-ancestors 'none'; base-uri 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# The session key lives in the URL fragment, which browsers never send — but
# a Referer from this page would carry the path, and nothing here needs it.
add_header Referrer-Policy "no-referrer" always;
# HTTPS only, for a year: a guest who once typed the bare name never goes to
# http again, where the first request could be answered by anyone between.
add_header Strict-Transport-Security "max-age=31536000" always;
