# Every answer from code.rishwanth.dev, the pad's origin: included in the
# server and again in each location that adds a header of its own, since a
# location's own add_header drops the server's.
#
# Cross-origin isolation is the reason this origin exists: the runtime needs
# SharedArrayBuffer. A subdomain keeps it from touching anything else.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# HTTPS only, for a year.
add_header Strict-Transport-Security "max-age=31536000" always;
# `unsafe-eval` rather than the narrower `wasm-unsafe-eval`, because the
# Wasmer SDK's worker evaluates a string as JavaScript and fails inside the
# worker without it — where the error reads as a hang. Tried, measured to
# break; nobody tightens it back without running the checks.
#
# `connect-src https:`, any https site, since 15 October: `curl`, urllib and
# requests in a pad are made by this page with fetch (pad/src/fetch-bridge.ts)
# to whatever site a program asks for. What this gives up is in
# docs/dev/security.md, "HTTP through the browser".
#
# The one inline script, the import map, is allowed by its hash, which
# pad/scripts/csp-check.mjs checks against the built page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob: 'sha256-huRNSawQCIrJA7BFNQFHfGUw3jJ4uVqTxVQU2nhRHi8='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://code.rishwanth.dev https:; frame-src https://preview.rishwanth.dev; frame-ancestors 'none'; base-uri 'none'" always;
