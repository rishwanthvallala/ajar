# What every route to the relay sends it: the host it was asked for and how
# (the relay writes /install.sh and /run.sh for the address they were fetched
# from), and the visitor's address, replaced rather than appended, so a
# caller cannot put an address of their own in front of it — the relay reads
# the last one, and this is the half that holds even if that changes.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Bodies passed on as they arrive, as Caddy did, so the relay's own limits
# apply to them: how much it holds at once, and how long one may go without a
# byte (BODY_IDLE). Its largest is 33 MiB (MAX_PAD_HTTP_BODY).
proxy_request_buffering off;
client_max_body_size 40m;
# A pad read can be 200 MB: never written to a temporary file here, so a slow
# reader holds the relay's read slot rather than this box's disk.
proxy_max_temp_file_size 0;
