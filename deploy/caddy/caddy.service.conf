# The packaged caddy.service, pointed at the build from deploy/caddy.
#
# Installed as /etc/systemd/system/caddy.service.d/ajar.conf. A drop-in rather
# than a replacement unit, so everything else the package sets — the user, the
# environment, the limits — stays the package's. The package's own binary is
# left at /usr/bin/caddy, unused: deleting this file and restarting is the
# whole of going back to it.
#
# The arguments are the package's, unchanged. Only the path differs.
[Service]
ExecStart=
ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force
