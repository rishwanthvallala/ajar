# nginx in front of the relay, for `run.sh proxies`: one worker, TLS with a
# throwaway certificate, connections to the relay kept open.
worker_processes 1;
events { worker_connections 8192; }
http {
  access_log off;
  upstream relay { server ajar-bench-relay:8787; keepalive 256; }
  server {
    listen 8443 ssl;
    ssl_certificate /tmp/cert.pem;
    ssl_certificate_key /tmp/key.pem;
    location / {
      proxy_pass http://relay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
  }
}
